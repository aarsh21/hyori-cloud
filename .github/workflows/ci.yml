name: Verify Hyori Cloud

# Pull requests run once on their merge result; pushes outside main would duplicate them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Hosted runners have 4 vCPUs; the local default of 2 leaves half of them idle.
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"

jobs:
  verify-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          architecture-checker: "true"
      - name: Format and lint
        run: bun run check
      - name: Verify anti-slop checker regressions and tooling types
        run: bun run test:anti-slop && bun run check:tooling-types && bun run check:scripts-types
      - name: Enforce TypeScript-only authored source
        run: bun run check:source-files
      - name: Run local anti-slop analysis
        run: bun run lint:anti-slop
      - name: Verify architecture checker and adopted rules
        run: bun run test:architecture
      - name: Verify package boundaries
        run: bun run check:boundaries
      - name: Verify feature boundaries and React Compiler diagnostics
        run: bun run lint:architecture
      - name: Run local React Doctor analysis
        run: bun run ui:doctor

  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the actual web app and its generated route tree
        run: bun run --cwd apps/web build
      - name: Verify private deployment and decoder isolation configuration
        run: bun run test:deployment
      - name: Test product behavior and actual Node host transport
        run: bun run test && bun run test:node-proxy
      - name: Verify external packed SDK consumers offline
        run: bun run check:artifacts
      - name: Verify actual app runtime composition
        run: bun run check:app-runtime
      - name: Verify web build and startup limits
        run: bun run check:web
      - name: Verify dev-server cancellation and visible HMR errors
        run: bun run check:dev-server

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: dev
          save-rust-cache: "true"
          architecture-checker: "true"
      - name: Build the actual web app and its generated route tree
        run: bun run --cwd apps/web build
      - name: Verify public SDK and Query contracts
        run: bun run check:query
      - name: Reject drift in Rust-derived client contracts
        run: bun run contracts:check

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: clippy
          save-rust-cache: "true"
      - name: Enforce Rust formatting and all-feature Clippy
        run: bun run check:rust --only fmt --only clippy

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: test
          save-rust-cache: "true"
      - name: Run Rust unit, integration and rustdoc tests
        run: bun run check:rust --only test

  rust-services:
    name: rust-services (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/media-image
        with:
          phase: start
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: test
      - name: Compile the service fixture tests while the decoder image builds
        run: bun scripts/check-rust.ts --services --shard ${{ matrix.shard }}/4 --no-run
      - uses: ./.github/actions/media-image
        with:
          phase: wait
      - name: Test explicit real PostgreSQL, RustFS and isolated media lifecycle fixtures
        env:
          HYORI_MEDIA_TEST_IMAGE: hyori-media-ci:${{ github.sha }}
          RUST_TEST_THREADS: "1"
        run: bun run test:rust-services --shard ${{ matrix.shard }}/4

  rust-sdk:
    name: rust-sdk (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [sdk, upload-sdk, photos-sdk, admin-sdk, media-sdk, editors-sdk]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.suite == 'media-sdk'
        uses: ./.github/actions/media-image
        with:
          phase: start
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: dev
      # The harnesses' cargo build then only checks freshness; editors-sdk starts its timeout before it.
      - name: Build the debug server the harness drives
        run: RUST_ICU_MAJOR_VERSION_NUMBER="$(pkg-config --modversion icu-uc | cut -d. -f1)" cargo build --locked --bin hyori-server
      - if: matrix.suite == 'media-sdk'
        uses: ./.github/actions/media-image
        with:
          phase: wait
      - name: Exercise the real Rust service through the public SDK (${{ matrix.suite }})
        if: matrix.suite != 'media-sdk'
        run: bun run test:rust-${{ matrix.suite }}
      - name: Exercise real isolated derivatives, recovery and purge through the public SDK
        if: matrix.suite == 'media-sdk'
        env:
          HYORI_MEDIA_TEST_IMAGE: hyori-media-ci:${{ github.sha }}
        run: bun run test:rust-media-sdk

  rust-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Build the Rust release container without publishing
        run: >-
          docker buildx build --progress plain --load
          --cache-from type=gha,scope=hyori-server
          --cache-to type=gha,scope=hyori-server,mode=max,ignore-error=true
          --build-arg CARGO_BUILD_JOBS=4
          --file apps/server/Dockerfile --tag hyori-rust-ci:${{ github.sha }} .
      - name: Drive the production-mode release image through the public SDK
        run: bun run test:rust-image hyori-rust-ci:${{ github.sha }}
      - name: Build the actual Nitro web host
        run: bun run --cwd apps/web build
      - name: Exercise public SDK through HTTPS termination and the built Nitro host
        run: bun run test:rust-web-host hyori-rust-ci:${{ github.sha }}

  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the minimal frontend container without publishing
        run: docker build --file apps/web/Dockerfile --tag hyori-web-ci:${{ github.sha }} .
      - name: Verify read-only nonroot frontend runtime and environment isolation
        run: bun run test:web-image hyori-web-ci:${{ github.sha }}

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install browser and synthetic media prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          bun x --no-install playwright-core install --with-deps chromium
      # Serial compilation bounds peak memory, including on the smaller local proof runner.
      - name: Build the release server and isolated decoder without publishing
        run: |
          docker build --progress plain --build-arg CARGO_BUILD_JOBS=1 --file apps/server/Dockerfile --tag hyori-browser-server:ci .
          docker build --progress plain --build-arg CARGO_BUILD_JOBS=1 --file apps/media-worker/Dockerfile --tag hyori-browser-worker:ci .
      - name: Build the actual web host
        run: bun run --cwd apps/web build
      - name: Exercise every non-editor browser scenario without retries
        shell: bash
        run: |
          failed=0
          # Fresh stacks keep account/library mutations and simulated thumbnail states isolated.
          for scenarios in \
            files,replacement,sharing,admin,derivatives,photos,concurrency,touch,readiness,screens \
            interface account phone-auth phone-completion resume \
            download-soak download-network-change thumbnail-latency thumbnail-states; do
            bun run test:rust-browser hyori-browser-server:ci \
              --worker=hyori-browser-worker:ci --fresh-image --no-build \
              --scenarios="$scenarios" --artifacts="browser-results/$scenarios" || failed=1
          done
          exit "$failed"
      - name: Upload browser reports, transport evidence and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: browser-results/
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - name: Install the pinned Rust advisory checker
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Reject new Rust advisories, including unmaintained and unsound warnings
        # Baseline exceptions, not security clearance. The owner decides which block release.
        # aws-sdk-s3 =1.157.0 retains its hyper 0.14 storage client: h2 0.3.27,
        # rustls 0.21.12 and rustls-webpki 0.101.7. Keep the storage network private;
        # these seven IDs remain open pending an SDK upgrade, especially for TLS storage.
        # Better Auth =1.0.0-alpha.5 -> jsonwebtoken 11.1.0 retains crypto-bigint 0.5.5
        # and rsa 0.9.10. Hyori uses opaque sessions; an auth upgrade is separate work.
        # libsqlite3-sys 0.30.1 is retained by optional sqlx-sqlite 0.8.6 in Cargo.lock
        # (sea-orm =2.0.0-rc.37); cargo tree --target all finds no active SQLite path.
        # Better Auth's rust_icu_* 5.8.0 retains paste 1.0.15 (build-time macro),
        # and its serde_yaml 0.9.34 retains unsafe-libyaml 0.2.11. Both unmaintained
        # dependencies need an upstream auth upgrade; do not ignore the warning category.
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2026-0346 \
            --ignore RUSTSEC-2026-0349 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0382 \
            --ignore RUSTSEC-2026-0387 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0449
      - name: Reject new JavaScript advisories in Bun's locked graph
        # apps/web pins @babel/core 7.29.0: sourceMappingURL local-file read during builds.
        # shadcn 4.23.0 -> @shadcn/registry 0.2.1 retains deepmerge 4.3.1:
        # prototype poisoning in tooling. Both need deliberate tooling upgrades.
        # eslint 10.14.0 and shadcn's ts-morph 26.0.0 retain minimatch 10.2.6:
        # glob amplification DoS in development tooling. No severity-wide suppression.
        run: |
          bun audit \
            --ignore GHSA-4x5r-pxfx-6jf8 \
            --ignore GHSA-gcqx-w48m-w2h4 \
            --ignore GHSA-g3hv-75wg-m249
