[package]
name = "hyori-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[dependencies]
aws-sdk-s3 = { version = "=1.157.0", default-features = false, features = [
  "rt-tokio",
  "rustls",
  "default-https-client",
  "http-1x",
] }
bytes = "1.11"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
http-body = "1"
sync_wrapper = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
uuid = { version = "1", features = ["v4"] }
