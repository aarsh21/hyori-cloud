[package]
name = "hyori-media-worker"
license.workspace = true
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
quote = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
