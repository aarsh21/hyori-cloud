[package]
name = "hyori-server"
license.workspace = true
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
better-auth = { version = "=1.0.0-alpha.5", default-features = false, features = ["rustls"] }
better-auth-core = "=1.0.0-alpha.5"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
futures-util = "0.3"
flate2 = "=1.1.10"
hyori-storage = { path = "../../crates/storage" }
hyori-media-worker = { path = "../media-worker" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
jsonschema = { version = "0.33", default-features = false }
rand = "0.9"
schemars = { version = "1.0", features = ["chrono04"] }
sea-orm = { version = "=2.0.0-rc.37", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "with-chrono",
  "with-json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
