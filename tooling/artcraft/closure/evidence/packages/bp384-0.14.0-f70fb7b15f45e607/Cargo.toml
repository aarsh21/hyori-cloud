[package]
edition = "2024"
rust-version = "1.85"
name = "bp384"
version = "0.14.0"
authors = ["RustCrypto Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Brainpool P-384 (brainpoolP384r1 and brainpoolP384t1) elliptic curves"
homepage = "https://github.com/RustCrypto/elliptic-curves/tree/master/bp384"
documentation = "https://docs.rs/bp384"
readme = "README.md"
keywords = [
    "brainpool",
    "crypto",
    "ecc",
]
categories = [
    "cryptography",
    "no-std",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/RustCrypto/elliptic-curves"
resolver = "2"

[package.metadata.docs.rs]
all-features = true

[features]
alloc = [
    "ecdsa?/alloc",
    "elliptic-curve/alloc",
    "primeorder?/alloc",
]
arithmetic = [
    "dep:primefield",
    "dep:primeorder",
]
default = [
    "pkcs8",
    "std",
]
getrandom = [
    "ecdsa?/getrandom",
    "elliptic-curve/getrandom",
]
pem = [
    "elliptic-curve/pem",
    "pkcs8",
]
pkcs8 = [
    "ecdsa/pkcs8",
    "elliptic-curve/pkcs8",
]
serde = [
    "ecdsa/serde",
    "elliptic-curve/serde",
]
