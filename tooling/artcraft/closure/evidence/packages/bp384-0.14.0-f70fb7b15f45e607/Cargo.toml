    "ecdsa/digest",
    "sha2",
]
std = [
    "alloc",
    "ecdsa?/std",
    "elliptic-curve/std",
    "getrandom",
    "primeorder?/std",
]

[lib]
name = "bp384"
path = "src/lib.rs"

[[bench]]
name = "field"
path = "benches/field.rs"
harness = false
required-features = ["arithmetic"]

[[bench]]
name = "point"
path = "benches/point.rs"
harness = false
required-features = ["arithmetic"]

[[bench]]
name = "scalar"
path = "benches/scalar.rs"
harness = false
