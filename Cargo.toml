[workspace]
members = ["apps/server", "apps/media-worker", "crates/storage"]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-or-later"

[profile.release]
lto = "thin"
strip = true

# Sign-in answers against a fixed deadline in tests as in production: unoptimized scrypt takes
# about 1.7 s per verification instead of about 75 ms.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
